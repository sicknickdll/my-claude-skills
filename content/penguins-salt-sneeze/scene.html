<!doctype html>
<html><head><meta charset="utf-8"><title>Penguins drink seawater</title>
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#EFE6D3}
#grain{position:fixed;inset:0;background:url(../../brand/grain.jpg) 0 0/1080px 1920px;mix-blend-mode:multiply;pointer-events:none}</style>
</head><body>
<div id="stage"></div><div id="grain"></div>
<script src="../../brand/kit.js"></script>
<script src="build/data.js"></script>
<script>
const K = KIT, { C, clamp, lerp, prog, ease, label, text } = K;
const Q = window.CUES, MOUTH = window.MOUTH, FPS = 30;
const S = (i) => Q[i].start, Wd = (i, w) => Q[i].words[w];

// ---------- episode drawings ----------
function penguin(x, y, s, rot = 0) { // full body, front view, feet at origin, ~420 tall
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">
    <ellipse cx="-36" cy="-4" rx="34" ry="12" fill="${C.red}"/><ellipse cx="36" cy="-4" rx="34" ry="12" fill="${C.red}"/>
    <path d="M-84,-262 C-140,-200 -152,-120 -132,-88 C-114,-140 -100,-196 -78,-226 Z" fill="${C.navy}"/>
    <path d="M84,-262 C140,-200 152,-120 132,-88 C114,-140 100,-196 78,-226 Z" fill="${C.navy}"/>
    <path d="M0,-420 C60,-420 86,-372 86,-320 C86,-262 120,-180 110,-92 C100,-22 60,-6 0,-6 C-60,-6 -100,-22 -110,-92 C-120,-180 -86,-262 -86,-320 C-86,-372 -60,-420 0,-420 Z" fill="${C.navy}"/>
    <path d="M0,-300 C52,-300 74,-230 76,-150 C78,-70 50,-26 0,-26 C-50,-26 -78,-70 -76,-150 C-74,-230 -52,-300 0,-300 Z" fill="${C.cream}"/>
    <circle cx="-30" cy="-352" r="13" fill="none" stroke="${C.cream}" stroke-width="6"/><circle cx="30" cy="-352" r="13" fill="none" stroke="${C.cream}" stroke-width="6"/>
    <circle cx="-30" cy="-352" r="5" fill="${C.cream}"/><circle cx="30" cy="-352" r="5" fill="${C.cream}"/>
    <path d="M-16,-330 L16,-330 L0,-296 Z" fill="${C.red}"/>
  </g>`;
}

function waves(t, y0, rows = 3) {
  let p = "";
  for (let r = 0; r < rows; r++) {
    const y = y0 + r * 52, off = ((t * 45 * (r % 2 ? 1 : -1)) % 120 + 120) % 120 - 120;
    let d = `M${off - 120},${y}`;
    for (let x = off - 120; x < 1200; x += 120) d += ` q30,-34 60,0 q30,34 60,0`;
    p += `<path d="${d}" fill="none" stroke="${C.navy}" stroke-width="13" stroke-linecap="round"/>`;
  }
  return p;
}

// Big penguin head in profile, facing left. Origin ~ centre of head.
function head(t, { gland = 0, drop = null, nostril = true } = {}) {
  let s = `<path d="M-150,60 C-200,260 -190,460 -170,1500 L380,1500 C340,420 300,180 200,30 Z" fill="${C.navy}"/>
    <path d="M-150,130 C-196,280 -188,460 -170,1500 L-10,1500 C-40,520 -60,300 -50,170 Z" fill="${C.cream}"/>
    <circle cx="40" cy="-40" r="232" fill="${C.navy}"/>
    <path d="M-150,-30 L-440,36 L-150,86 Z" fill="${C.navy}"/>
    <path d="M-162,30 L-428,38" stroke="${C.cream}" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-60" cy="-58" r="30" fill="${C.navy}" stroke="${C.cream}" stroke-width="13"/>
    <circle cx="-68" cy="-66" r="6" fill="${C.cream}"/>`;
  if (nostril) s += `<ellipse cx="-206" cy="6" rx="18" ry="5" transform="rotate(12 -206 6)" fill="${C.cream}"/>`;
  if (gland > 0) s += `<g transform="translate(-40 -152) rotate(-12) scale(${gland})"><ellipse rx="74" ry="30" fill="${C.red}"/><ellipse cx="-20" cy="-6" rx="22" ry="7" fill="${C.cream}" opacity=".55"/></g>`;
  if (drop) s += drop;
  return s;
}

function drip(t) { // salty drop: forms at the nostril, slides down the beak, falls off the tip
  const p = (t % 1.5) / 1.5;
  let x, y, r;
  if (p < 0.2) { x = -206; y = 12; r = 14 * (p / 0.2); }
  else if (p < 0.7) { const u = ease.inOut((p - 0.2) / 0.5); x = lerp(-206, -425, u); y = lerp(14, 50, u); r = 14; }
  else { const u = (p - 0.7) / 0.3; x = -425 - 10 * u; y = 50 + 520 * u * u; r = 14; }
  return `<path transform="translate(${x} ${y}) scale(${r / 14})" d="M0,-24 C8,-10 14,-2 14,8 A14,14 0 1,1 -14,8 C-14,-2 -8,-10 0,-24 Z" fill="${C.cream}" stroke="${C.navy}" stroke-width="4"/>`;
}

function star4(x, y, r, fill) {
  return `<path transform="translate(${x} ${y})" d="M0,${-r} Q${r * .18},${-r * .18} ${r},0 Q${r * .18},${r * .18} 0,${r} Q${-r * .18},${r * .18} ${-r},0 Q${-r * .18},${-r * .18} 0,${-r} Z" fill="${fill}"/>`;
}

function glass(t, t0) { // glass of seawater with salt falling in; local origin = centre
  let salt = "";
  for (let i = 0; i < 9; i++) {
    const a = t0 + 0.25 + i * 0.12, k = clamp((t - a) / 0.6), sx = -90 + (i * 71) % 180;
    if (t > a) { const y = lerp(-420, -60 + (i % 3) * 70, ease.inOut(k)); salt += `<rect x="${sx}" y="${y}" width="22" height="22" transform="rotate(${i * 23} ${sx + 11} ${y + 11})" fill="${C.cream}" stroke="${C.navy}" stroke-width="3"/>`; }
  }
  return `<path d="M-128,-100 q34,-22 68,0 q34,22 68,0 q34,-22 68,0 q34,22 68,0 L115,190 L-115,190 Z" fill="${C.navy}"/>${salt}
    <path d="M-150,-190 L150,-190 L115,200 L-115,200 Z" fill="none" stroke="${C.navy}" stroke-width="12" stroke-linejoin="round"/>`;
}

const bg = (dx, col = C.paper) => `<rect x="${dx}" y="0" width="1080" height="1920" fill="${col}"/>`;
const tag = (t, at, x, y, str, { size = 40, w = null } = {}) => { // Vox highlighter tag: red box, cream type
  if (t < at) return "";
  const ww = w ?? str.length * size * 0.72 + 30;
  return K.highlight(t, at, x, y - size * 1.05, ww, size * 1.4) +
    `<g opacity="${clamp((t - at - 0.1) / 0.15)}">${text(x + 15, y, str, { size, fill: C.cream, ls: 0.06, upper: true })}</g>`;
};
const arrow = (t, at, d, len = 260) => t < at ? "" :
  `<path d="${d}" fill="none" stroke="${C.red}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${len}" stroke-dashoffset="${len * (1 - ease.out(prog(t, at, 0.35)))}"/>`;

// ---------------- shots ----------------
function sIntro(t, dx, blur) {
  const keys = [{ t: 0, x: 540, y: 600, s: 1 }, { t: S(1), x: 540, y: 612, s: 1.07 }];
  const pose = K.hops(t, { x: -220, y: 1180, s: 1.3 }, [{ at: 0.05, x: 540, h: 260, dur: 0.6 }]);
  const w = 420 * ease.out(prog(t, 0.05, 0.45)), ring = 2 * Math.PI * 382;
  const ink = `<circle cx="540" cy="830" r="360" fill="${C.cream}"/>
    <circle cx="540" cy="830" r="382" fill="none" stroke="${C.navy}" stroke-width="8" stroke-dasharray="${ring}" stroke-dashoffset="${ring * (1 - ease.out(prog(t, 0.1, 0.7)))}"/>
    <line x1="${540 - w}" y1="170" x2="${540 + w}" y2="170" stroke="${C.navy}" stroke-width="7"/>
    <line x1="${540 - w}" y1="505" x2="${540 + w}" y2="505" stroke="${C.navy}" stroke-width="7"/>
    ${K.frog({ ...pose, mouth: MOUTH[Math.round(t * FPS)] || 0, blink: K.blink(t), gaze: 0 })}`;
  const hl = t > 0.95;
  const crisp = K.typeOn(t, 0.12, 540, 320, "Did you", { size: 140, anchor: "middle", cps: 16 }) +
    K.highlight(t, 0.95, 345, 368, 390, 128) +
    K.typeOn(t, 0.56, 540, 470, "know?", { size: 140, anchor: "middle", cps: 16, fill: hl ? C.cream : C.navy });
  return bg(dx) + K.shot(t, keys, { ink, crisp, dx, extraBlur: blur });
}

const ANT = "M1000,420 C1250,400 1520,520 1600,760 C1680,980 1640,1240 1480,1400 C1380,1500 1250,1520 1140,1450 C1060,1400 1000,1470 900,1520 C760,1580 560,1500 470,1330 C380,1170 420,1000 520,900 C560,860 540,800 470,740 C400,680 330,600 300,520 C350,560 440,600 520,640 C600,680 640,640 700,580 C780,500 880,430 1000,420 Z";
function sMap(t, dx, blur) {
  const keys = [{ t: S(1) - 0.3, x: 1000, y: 1000, s: 0.5, r: -10 }, { t: S(1) + 1.3, x: 600, y: 900, s: 1.35, r: 0 }, { t: S(2) + 0.3, x: 585, y: 885, s: 1.5 }];
  let marks = "";
  for (let i = 0; i < 90; i++) {
    const x = (i * 397) % 2600 - 300, y = (i * 271) % 2600 - 300;
    if (Math.hypot(x - 1000, y - 1000) > 720) marks += `<path d="M${x},${y} q15,-12 30,0 q15,12 30,0" fill="none" stroke="${C.cream}" stroke-width="5" opacity=".55"/>`;
  }
  const pk = prog(t, S(1) + 0.55, 0.35), py = lerp(560, 880, ease.back(pk));
  const ink = `<rect x="-3000" y="-3000" width="8000" height="8000" fill="${C.navy}"/>${marks}
    <circle cx="1000" cy="1000" r="780" fill="none" stroke="${C.cream}" stroke-width="3" stroke-dasharray="14 18" opacity=".5"/>
    <circle cx="1000" cy="1000" r="1000" fill="none" stroke="${C.cream}" stroke-width="3" stroke-dasharray="14 18" opacity=".5"/>
    <path d="${ANT}" fill="${C.cream}"/>
    ${t > S(1) + 0.55 ? `<g transform="translate(560 ${py})"><path d="M0,0 L-16,-46 A26,26 0 1,1 16,-46 Z" fill="${C.red}"/><circle cx="0" cy="-62" r="9" fill="${C.cream}"/></g>` : ""}`;
  const crisp = text(720, 1030, "ANTARCTICA", { size: 46, anchor: "middle", ls: 0.2 }) + text(1000, 300, "SOUTHERN OCEAN", { size: 44, anchor: "middle", fill: C.cream, ls: 0.25 });
  // photo card slides in on top of the map (screen space)
  const ck = prog(t, S(1) + 0.95, 0.5), cy = lerp(2300, 640, ease.out(ck)), dip = Math.sin(Math.PI * clamp((t - S(1) - 1.6) / 1.1)) * -18;
  const card = t < S(1) + 0.95 ? "" : `<g transform="translate(540 ${cy}) rotate(-4)">
      <rect x="-310" y="-330" width="620" height="660" fill="${C.cream}" stroke="${C.navy}" stroke-width="4"/>
      <clipPath id="cardc"><rect x="-280" y="-300" width="560" height="520"/></clipPath>
      <g clip-path="url(#cardc)"><rect x="-280" y="-300" width="560" height="520" fill="${C.paper}"/>
        <rect x="-280" y="80" width="560" height="200" fill="${C.navy}"/>
        <g transform="translate(-540 -800)">${waves(t, 920, 3).replace(/stroke="#1E3473"/g, `stroke="${C.cream}"`)}</g>
        <path d="M-160,90 L160,90 L130,130 L-130,130 Z" fill="${C.cream}" stroke="${C.navy}" stroke-width="6"/>
        ${penguin(0, 92, 0.8, dip)}</g>
      <rect x="-90" y="-356" width="180" height="48" fill="${C.red}" opacity=".9" transform="rotate(5)"/></g>`;
  const screen = tag(t, Wd(1, 3), 250, 1035, "seawater", { size: 54 });
  return bg(dx) + K.shot(t, keys, { ink, crisp, screenInk: card, screen, dx, extraBlur: blur });
}

function sNotes(t, dx, blur) {
  const keys = [{ t: S(2) - 0.25, x: 560, y: 430, s: 1.25, r: -3 }, { t: S(2) + 1.2, x: 560, y: 600, s: 1.0, r: -1 }, { t: Wd(2, 5) - 0.2, x: 700, y: 860, s: 1.12, r: 0 }, { t: S(3) + 0.4, x: 720, y: 900, s: 1.2 }];
  let bars = "";
  for (let i = 0; i < 26; i++) { const y = 640 + i * 34, w = 220 + ((i * 53) % 130); bars += `<rect x="160" y="${y}" width="${i % 7 === 6 ? w * 0.5 : w + 110}" height="12" fill="${C.navy}" opacity=".28"/>`; }
  for (let i = 0; i < 9; i++) { const y = 1260 + i * 34; bars += `<rect x="620" y="${y}" width="${260 + ((i * 41) % 110)}" height="12" fill="${C.navy}" opacity=".28"/>`; }
  const X = Wd(2, 5);
  const ink = `<rect x="-400" y="-400" width="1880" height="3000" fill="${C.cream}"/>
    <line x1="120" y1="-400" x2="120" y2="2600" stroke="${C.red}" stroke-width="4" opacity=".7"/>
    <line x1="120" y1="262" x2="1020" y2="262" stroke="${C.navy}" stroke-width="5"/><line x1="120" y1="276" x2="1020" y2="276" stroke="${C.navy}" stroke-width="2"/>
    ${bars}
    <g transform="translate(790 980) scale(.85)">${glass(t, S(2) + 0.3)}</g>
    ${K.stamped(t, X, 790, 980, `<path d="M660,830 L920,1130 M920,830 L660,1130" stroke="${C.red}" stroke-width="40" stroke-linecap="round"/>`, { rot: 4 })}`;
  const crisp = K.typeOn(t, S(2) + 0.1, 160, 230, "FIELD NOTES · Nº 1", { size: 38, ls: 0.12, cps: 30 }) +
    text(160, 400, "Seawater is", { size: 110 }) +
    K.drawText(t, S(2) + 0.45, 160, 530, "3.5 % salt", { size: 130, anchor: "start", dur: 0.9 }) +
    K.highlight(t, S(2) + 1.3, 160, 552, 620, 20) +
    tag(t, X + 0.2, 640, 1220, "for humans", { size: 36 });
  return bg(dx) + K.shot(t, keys, { ink, crisp, dx, extraBlur: blur });
}

const HEADW = (inner = "") => `<circle cx="560" cy="640" r="520" fill="${C.cream}"/><circle cx="560" cy="640" r="548" fill="none" stroke="${C.navy}" stroke-width="8"/>${inner}`;
function sHead(t, dx, blur) {
  const G = Wd(3, 3), E = Wd(4, 3);
  const keys = [{ t: S(3) - 0.3, x: 500, y: 650, s: 0.85 }, { t: S(3) + 0.5, x: 520, y: 640, s: 1.0 }, { t: G + 0.15, x: 560, y: 520, s: 1.6 },
    { t: S(4) + 0.4, x: 520, y: 590, s: 1.45 }, { t: S(5) - 0.5, x: 525, y: 585, s: 1.5 }, { t: S(5), x: 572, y: 518, s: 16, e: "in" }];
  const g = t < G ? 0 : ease.back(prog(t, G, 0.35));
  const ink = HEADW(`<g transform="translate(620 700) scale(1.2)">${head(t, { gland: g })}</g>`);
  const crisp = K.circleCallout(t, G + 0.15, 572, 518, 125, 66) +
    tag(t, G + 0.35, 250, 395, "salt gland", { size: 38 }) + arrow(t, G + 0.4, "M400,410 L470,475", 110) +
    arrow(t, E, "M455,500 Q395,580 490,630", 200) + tag(t, E + 0.15, 280, 720, "eye", { size: 38 });
  const flash = `<rect width="1080" height="1920" fill="${C.red}" opacity="${prog(t, S(5) - 0.18, 0.16)}"/>`;
  return bg(dx) + K.shot(t, keys, { ink, crisp, screen: flash, dx, extraBlur: blur });
}

function sGland(t, dx, blur) {
  const keys = [{ t: S(5), x: 540, y: 560, s: 3.2 }, { t: S(5) + 0.9, x: 540, y: 600, s: 1.0, e: "out" }, { t: S(6), x: 500, y: 610, s: 1.06 }, { t: S(7), x: 590, y: 590, s: 1.12 }];
  const u = t - S(5);
  let grid = "", cells = "", salt = "";
  for (let x = -600; x <= 1700; x += 60) grid += `<line x1="${x}" y1="-600" x2="${x}" y2="1900" stroke="${C.navy}" stroke-width="2" opacity=".12"/>`;
  for (let y = -600; y <= 1900; y += 60) grid += `<line x1="-600" y1="${y}" x2="1700" y2="${y}" stroke="${C.navy}" stroke-width="2" opacity=".12"/>`;
  for (let i = 0; i < 20; i++) cells += `<circle cx="${-80 + ((i * 113 + u * 190) % 1240)}" cy="${645 + ((i * 37) % 60)}" r="15" fill="${C.red}"/>`;
  for (let i = 0; i < 9; i++) {
    const p = ((i / 9) + u * 0.22) % 1;
    let x, y;
    if (p < 0.55) { x = lerp(-60, 520, p / 0.55); y = 670 + ((i * 29) % 40) - 20; } else { const k = ease.inOut((p - 0.55) / 0.45); x = lerp(520, 540, k); y = lerp(670, 400, k); }
    if (p < 0.97) salt += `<rect x="${x - 12}" y="${y - 12}" width="24" height="24" transform="rotate(${i * 31 + u * 40} ${x} ${y})" fill="${C.navy}"/>`;
  }
  const drop = 30 + 26 * clamp(u / 5);
  const ink = `<rect x="-800" y="-800" width="2700" height="2900" fill="${C.paper}"/>${grid}
    <path d="M-600,610 L1700,610 M-600,730 L1700,730" stroke="${C.red}" stroke-width="12"/>${cells}
    <ellipse cx="540" cy="560" rx="150" ry="70" fill="${C.red}"/>${salt}
    <path transform="translate(540 380) scale(${drop / 30})" d="M0,-44 C14,-20 30,-4 30,14 A30,30 0 1,1 -30,14 C-30,-4 -14,-20 0,-44 Z" fill="${C.cream}" stroke="${C.navy}" stroke-width="6"/>
    ${K.stamped(t, Wd(6, 4), 540, 560, `<rect x="440" y="530" width="200" height="62" fill="${C.navy}"/>` + text(540, 576, "FILTER", { size: 40, fill: C.cream, anchor: "middle" }), { rot: -3 })}`;
  const crisp = K.typeOn(t, S(5) + 0.9, 540, 250, "INSIDE THE SALT GLAND", { size: 44, anchor: "middle", ls: 0.12, cps: 28 }) +
    label(t, S(5) + 1.0, 110, 830, "salty blood", { size: 38 }) + label(t, S(5) + 1.3, 970, 830, "clean blood", { size: 38, anchor: "end" }) +
    label(t, Wd(5, 2), 610, 380, "salt out", { size: 38, fill: C.navy });
  const flash = `<rect width="1080" height="1920" fill="${C.red}" opacity="${1 - prog(t, S(5), 0.3)}"/>`;
  return bg(dx) + K.shot(t, keys, { ink, crisp, screen: flash, dx, extraBlur: blur });
}

function sSneeze(t, dx, blur) {
  const ach = S(9), wind = Wd(8, 2), gone = Wd(9, 2);
  const keys = [{ t: S(7), x: 380, y: 700, s: 1.6 }, { t: S(7) + 1.6, x: 250, y: 730, s: 1.6 }, { t: S(8), x: 330, y: 690, s: 1.5 },
    { t: wind, x: 340, y: 680, s: 1.5 }, { t: ach, x: 380, y: 650, s: 1.9, e: "in" }, { t: ach + 0.3, x: 430, y: 640, s: 1.05, e: "out" }, { t: S(10), x: 440, y: 640, s: 1.0 }];
  let rot = 0;
  if (t > wind && t < ach) rot = 9 * ease.inOut(prog(t, wind, ach - wind));
  if (t >= ach) { const k = t - ach; rot = 9 - 24 * ease.out(clamp(k / 0.12)) + 15 * clamp((k - 0.12) / 0.5); }
  let spray = "", sparkle = "";
  if (t >= ach && t < ach + 1.2) {
    const k = t - ach;
    for (let i = 0; i < 16; i++) {
      const a = Math.PI * (0.85 + (i / 16) * 0.5), v = 520 + (i * 97) % 380;
      spray += `<circle cx="${-430 + Math.cos(a) * v * k}" cy="${40 - Math.sin(a) * v * k * 0.6 + 600 * k * k}" r="${10 + (i % 3) * 5}" fill="${C.cream}" stroke="${C.navy}" stroke-width="3" opacity="${1 - k / 1.2}"/>`;
    }
  }
  if (t > gone) for (let i = 0; i < 5; i++) {
    const k = ease.back(prog(t, gone + i * 0.08, 0.3)), [sx, sy] = [[120, 560], [260, 500], [60, 760], [330, 620], [190, 860]][i];
    sparkle += star4(sx, sy, 34 * k * (1 + 0.15 * Math.sin(t * 9 + i)), i % 2 ? C.red : C.navy);
  }
  const ink = HEADW(`<g transform="translate(620 700) scale(1.2) rotate(${rot} 40 200)">${head(t, { gland: 1, drop: t < ach ? drip(t - S(7)) : "" })}${spray}</g>`) + sparkle;
  const crisp = tag(t, Wd(7, 6), 170, 860, "nostril", { size: 38 }) + arrow(t, Wd(7, 6) + 0.1, "M300,830 L360,720", 130);
  let screen = "";
  if (t >= ach) {
    const k = prog(t, ach, 0.22), s = lerp(2.2, 1, ease.out(k));
    screen = `<g opacity="${clamp(k * 3)}" transform="translate(540 330) rotate(-6) scale(${s}) translate(-540 -330)">${text(540, 380, "ACHOO!", { size: 170, fill: C.red, anchor: "middle" })}</g>`;
  }
  return bg(dx) + K.shot(t, keys, { ink, crisp, screen, dx, extraBlur: blur, shk: K.shake(t, ach, 22, 5) });
}

function sEnd(t, dx, blur) {
  const keys = [{ t: S(10) - 0.4, x: 540, y: 600, s: 1 }, { t: 30, x: 540, y: 620, s: 1.06 }];
  const pose = K.hops(t, { x: 540, y: 2150, s: 1.3 }, [{ at: S(10) + 0.15, x: 540, y: 1240, h: 220, dur: 0.6 }]);
  let stars = "";
  for (let i = 0; i < 10; i++) { const a = (i / 10) * Math.PI * 2 + 0.3; stars += star4(540 + Math.cos(a) * 205, 520 + Math.sin(a) * 240, 22, C.cream); }
  const tip = (t - Wd(10, 3)) / 0.7, hat = tip > 0 && tip < 1 ? { hatY: -45 * Math.sin(Math.PI * tip), hatRot: -14 * Math.sin(Math.PI * tip) } : {};
  const ink = K.stamped(t, S(10) + 0.05, 540, 520, `<ellipse cx="540" cy="520" rx="290" ry="320" fill="${C.navy}"/>
      <ellipse cx="540" cy="520" rx="270" ry="300" fill="none" stroke="${C.cream}" stroke-width="7"/>${stars}` +
      text(540, 620, "?", { size: 290, fill: C.cream, anchor: "middle" }), { rot: -3 }) +
    K.frog({ ...pose, mouth: MOUTH[Math.min(MOUTH.length - 1, Math.round(t * FPS))] || 0, blink: K.blink(t), gaze: 0, ...hat });
  return bg(dx) + K.shot(t, keys, { ink, dx, extraBlur: blur });
}

const SHOTS = [
  { a: 0, b: S(1), draw: sIntro }, { a: S(1), b: S(2), draw: sMap }, { a: S(2), b: S(3), draw: sNotes },
